<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reduto dos Pergaminhos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="livro-pergaminho">
        <h1>Bem Vindos</h1>
        <p class="instrucao-texto">Para dar início, leia as instruções abaixo:</p>
        
        <ul class="lista-pergaminho">
            <li>Escolher o arquivo PDF no dispositivo.</li>
            <li>Ajustar o tema visual das crônicas.</li>
            <li>Ativar a trilha sonora temática.</li>
        </ul>

        <div class="container-botao">
            <label for="input-arquivo" class="botao-pergaminho">
                Escolher Pergaminho (PDF)
            </label>
            <input type="file" id="input-arquivo" accept=".pdf">
            <p id="mensagem-status" style="margin-top: 15px; font-style: italic;"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
